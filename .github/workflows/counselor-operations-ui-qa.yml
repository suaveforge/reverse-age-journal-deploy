name: Counselor local-source operations UI QA (no real calls)
on:
  push:
    branches: [main]
    paths: [.github/workflows/counselor-operations-ui-qa.yml, index.html, operations.js, styles.css]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate counselor buttons against deterministic non-billable API fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install playwright pillow
          python3 -m http.server 18761 --bind 127.0.0.1 >/tmp/raj-local-http.log 2>&1 &
          cat >/tmp/raj-ops-ui.py <<'PY'
          import json,re,io,base64
          from PIL import Image
          from playwright.sync_api import sync_playwright,expect
          URL='http://127.0.0.1:18761/'
          state={'created':False,'credits':0,'bookings':[],'profile':None}
          def fulfill(route):
              req=route.request
              path=req.url.split('/api/pilot/',1)[-1].split('?',1)[0]
              status=200
              body={}
              if path=='verify' and req.method=='POST':
                  body={'authorized':True,'evidence_connected':True}
              elif path=='operations/subjects' and req.method=='GET':
                  body={'subjects':[{'id':'person_mock001','name':'테스트 이름','balance':state['credits']}] if state['created'] else []}
              elif path=='operations/subjects' and req.method=='POST':
                  state['created']=True
                  state['profile']={
                    'id':'person_mock001','name':'테스트 이름','phone':'+821012345678',
                    'family_phone':'+821098765432','participant_consent':True,
                    'recurring_consent':True,'family_notifications_consent':True,
                    'followup_days':3,'retry_limit':3,'preferred_hour':14}
                  body={'id':'person_mock001','name':'테스트 이름'}
                  status=201
              elif path=='operations/subjects/person_mock001':
                  if req.method=='PATCH':
                      new=req.post_data_json
                      state['profile'].update(new)
                      body={'saved':True,'subject_id':'person_mock001'}
                  else:
                      body={'subject':state['profile'],
                         'balance':state['credits'],
                         'completed_calls':0,
                         'credit_history':([{'delta':state['credits'],'kind':'TRIAL','created_at':'2026-10-31'}] if state['credits'] else []),
                         'script':{'stage':'FIRST','prompt':'오늘 하루를 편안히 이야기해 주세요.','prior_story':None},
                         'appointments':state['bookings']}
              elif path=='operations/trial-credits':
                  state['credits']=3
                  body={'balance':3,'credits_kind':'TRIAL_NOT_PAYMENT'}
              elif path=='operations/bookings':
                  state['bookings']=[{'id':'appt_mock','due_at':'2026-11-04T05:00:00+00:00','state':'SCHEDULED','attempt_count':0}]
                  body={'appointment_id':'appt_mock','automatic_phone_delivery_enabled':False}
                  status=201
              elif path=='diaries':
                  body={'diaries':[],'retention_days':14}
              elif path=='billing/packages':
                  if req.method=='GET': body={'packages':[],'payhub_ready':False}
                  else: body={'saved':True,'live_checkout_enabled':False}
              elif path=='operations/outbox':
                  body={'messages':[],'delivery_enabled':False}
              elif path=='operations/subjects/person_mock001/monthly-report':
                  body={'month':'2026-10','name':'테스트 이름','calls_completed':1,
                    'diaries_saved':1,'credits_remaining':2,
                    'stories':[{'title':'오늘의 기록','excerpt':'실제 대화에서 나온 내용만 기록'}]}
              else:
                  status=404;body={'detail':'FIXTURE_NOT_DEFINED:'+path}
              route.fulfill(status=status,content_type='application/json',body=json.dumps(body,ensure_ascii=False))
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
              for size in [(1365,900),(390,844)]:
                  state.update({'created':False,'credits':0,'bookings':[],'profile':None})
                  page=browser.new_page(viewport={'width':size[0],'height':size[1]})
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.route('**/api/pilot/**',fulfill)
                  r=page.goto(URL,wait_until='networkidle',timeout=40000)
                  assert r.status==200
                  assert page.locator('#family-journey').is_visible()
                  assert page.locator('#counselor-pilot').is_hidden()
                  assert page.evaluate('document.body.scrollHeight')<=size[1]+110, 'public intro must fit one screen'
                  page.locator('#admin-entry').click()
                  assert page.locator('#family-journey').is_hidden()
                  assert page.locator('#pilot-login').is_visible()
                  page.locator('#pilot-access').fill('fake-counselor-access-code-987')
                  page.locator('#pilot-verify').click()
                  expect(page.locator('#pilot-management')).to_be_visible(timeout=12000)
                  page.locator('#ops-name').fill('테스트 이름')
                  page.locator('#ops-phone').fill('01012345678')
                  page.locator('#ops-family-phone').fill('01098765432')
                  page.locator('#ops-consent').check()
                  page.locator('#ops-recurring-consent').check()
                  page.locator('#ops-family-consent').check()
                  page.locator('#ops-add').click()
                  expect(page.locator('#pilot-subject-select')).to_have_value('person_mock001')
                  expect(page.locator('#ops-profile-details')).to_be_visible()
                  expect(page.locator('#ops-profile-panel')).to_be_hidden()
                  page.locator('#ops-profile-details summary').click()
                  expect(page.locator('#ops-profile-panel')).to_be_visible()
                  page.locator('#ops-edit-name').fill('변경된 이름')
                  page.locator('#ops-followup-days').select_option('7')
                  page.locator('#ops-retry-limit').select_option('2')
                  page.locator('#ops-preferred-hour').select_option('16')
                  page.locator('#ops-save-profile').click()
                  expect(page.locator('#ops-edit-name')).to_have_value('변경된 이름',timeout=12000)
                  assert state['profile']['followup_days']==7
                  assert state['profile']['retry_limit']==2
                  page.locator('#ops-trial').click()
                  expect(page.locator('#ops-credit')).to_contain_text('3회')
                  expect(page.locator('#pilot-saved')).to_be_hidden()
                  expect(page.locator('#auth-button')).to_be_hidden()
                  expect(page.locator('#ops-trial')).to_be_hidden()
                  page.locator('#ops-profile-details summary').click()
                  expect(page.locator('#ops-profile-panel')).to_be_hidden()
                  shot=page.screenshot(full_page=True)
                  pic=Image.open(io.BytesIO(shot)).convert('RGB')
                  pic.thumbnail((830,1150))
                  buffer=io.BytesIO()
                  pic.save(buffer,format='JPEG',quality=65,optimize=True)
                  print('RAJ_INFO_IMAGE_'+('DESKTOP' if size[0]>600 else 'MOBILE')+'='+base64.b64encode(buffer.getvalue()).decode(),flush=True)
                  page.locator('[data-ops-tab="tickets"]').click()
                  expect(page.locator('#ops-ticket-history')).to_contain_text('체험 충전')
                  expect(page.locator('#ops-payhub-status')).to_be_hidden()
                  expect(page.locator('#ops-pay-checkout')).to_be_hidden()
                  page.locator('[data-ops-tab="call"]').click()
                  page.locator('#ops-date').fill('2026-11-04T14:00')
                  page.locator('#ops-book').click()
                  expect(page.locator('#ops-appointments')).to_contain_text('예약됨')
                  page.locator('[data-ops-tab="record"]').click()
                  page.locator('#ops-report-month').fill('2026-10')
                  page.locator('#ops-report').click()
                  expect(page.locator('#ops-report-output')).to_have_value(re.compile('가족 이야기 기록'),timeout=12000)
                  assert page.evaluate('document.documentElement.scrollWidth')==size[0], 'horizontal overflow'
                  assert not errors,errors
                  print('RAJ_COUNSELOR_OPERATIONS_UI_'+('DESKTOP' if size[0]>600 else 'MOBILE')+'=PASS',flush=True)
                  page.close()
              browser.close()
          print('RAJ_NO_REAL_CALLS_OR_CUSTOMER_RECORDS_CREATED=PASS')
          PY
          python3 /tmp/raj-ops-ui.py
