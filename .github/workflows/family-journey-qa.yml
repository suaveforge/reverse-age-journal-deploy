name: Family benchmarked consent-first PayHub QA
on:
  push:
    branches: [main]
    paths: [family-demo.js, app.js, index.html, styles.css, .github/workflows/family-journey-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Test guardian, elder intake, manual consent, verified payment and booking
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app.js
          node --check family-demo.js
          python3 -m pip -q install playwright
          python3 -m http.server 18765 --bind 127.0.0.1 >/tmp/family-server.log 2>&1 &
          cat >/tmp/family-qa.py <<'PY'
          import json,datetime
          from playwright.sync_api import sync_playwright,expect
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
              for width,height in [(1365,900),(390,844)]:
                  state={'approved':False,'onboarded':False}
                  def fake(route):
                      req=route.request
                      endpoint=req.url.split('/api/pilot/family/')[-1]
                      if endpoint=='onboarding':
                          if req.method=='POST':
                              body=req.post_data_json
                              assert body['elder_name']=='할머니'
                              assert body['relationship']=='부모님'
                              assert body['preferred_hour']==14
                              state['onboarded']=True
                              body={'registered':True,'consent':'PENDING'}
                          else:
                              body={'registered':state['onboarded'],
                                    'consent':'CONFIRMED' if state['approved'] else 'PENDING',
                                    'elder_name':'할머니','booking_at':'2026-12-05T05:00:00Z'}
                      elif endpoint=='payment-ready':
                          body={'ready':True,'packages':[{'code':'FIVE','sessions':5,'price_krw':1000},
                                {'code':'TEN','sessions':10,'price_krw':2000}]}
                      elif endpoint.startswith('orders/'):
                          body={'state':'PAID','sessions':5,'order_id':'ord_'+'a'*32}
                      elif endpoint=='bookings':
                          assert req.post_data_json['order_id']=='ord_'+'a'*32
                          body={'saved':True,'real_phone_call':False}
                      else:
                          route.fulfill(status=404,content_type='application/json',body='{"detail":"UNEXPECTED"}')
                          return
                      route.fulfill(status=200,content_type='application/json',body=json.dumps(body),
                                    headers={'access-control-allow-origin':'*','access-control-allow-headers':'*','access-control-allow-methods':'GET, POST, OPTIONS'})
                  page=browser.new_page(viewport={'width':width,'height':height})
                  exceptions=[]
                  page.on('pageerror',lambda e:exceptions.append(str(e)))
                  page.route('**/api/pilot/family/**',fake)
                  page.goto('http://127.0.0.1:18765/',wait_until='networkidle',timeout=30000)
                  expect(page.locator('#family-start')).to_be_visible()
                  expect(page.locator('#admin-entry')).to_have_text('관리자 접속하기')
                  assert page.evaluate('document.documentElement.scrollWidth')==width
                  assert page.evaluate('document.body.scrollHeight')<=height+110
                  page.locator('#family-start').click()
                  page.locator('#family-name').fill('보호자')
                  page.locator('#guardian-phone').fill('01023456789')
                  page.locator('#family-next').click()
                  expect(page.locator('#family-elder')).to_be_visible()
                  page.locator('#family-elder').fill('할머니')
                  page.locator('#family-phone').fill('01012345678')
                  page.locator('#family-information-consent').check()
                  page.locator('#family-register').click()
                  expect(page.locator('#family-consent-check')).to_be_visible()
                  assert page.locator('#family-pay').count()==0, 'payment before consent'
                  page.locator('#family-consent-check').click()
                  expect(page.locator('#family-error')).to_contain_text('상담사의 동의 확인이 아직 완료되지 않았습니다.')
                  state['approved']=True
                  page.locator('#family-consent-check').click()
                  expect(page.locator('#family-plans .family-button')).to_have_count(2)
                  page.locator('#family-plans .family-button').first.click()
                  expect(page.locator('#family-pay')).to_be_visible()
                  expect(page.locator('.family-amount')).to_contain_text('1,000원')
                  # Return from PayHub is represented by an existing order,
                  # but only the server can confirm PAID.
                  page.evaluate("""() => {
                    const x=JSON.parse(sessionStorage.getItem('raj.family.walkthrough.v2'));
                    x.orderId='ord_'+'a'.repeat(32);
                    sessionStorage.setItem('raj.family.walkthrough.v2',JSON.stringify(x))
                  }""")
                  page.reload(wait_until='networkidle')
                  expect(page.locator('#family-when')).to_be_visible(timeout=10000)
                  date=(datetime.datetime.now()+datetime.timedelta(days=8)).replace(hour=14,minute=0)
                  page.locator('#family-when').fill(date.strftime('%Y-%m-%dT%H:%M'))
                  page.locator('#family-reserve').click()
                  expect(page.locator('.family-confirm')).to_contain_text('할머니')
                  expect(page.locator('#family-dashboard')).to_be_visible()
                  assert page.locator('#family-record').count()==0
                  page.locator('#admin-entry').click()
                  expect(page.locator('#counselor-pilot')).to_be_visible()
                  page.locator('#admin-entry').click()
                  expect(page.locator('#family-dashboard')).to_be_visible()
                  page.locator('#family-dashboard').click()
                  expect(page.locator('.family-confirm')).to_be_visible()
                  assert page.evaluate('document.documentElement.scrollWidth')==width
                  assert not exceptions,exceptions
                  print('RAJ_BENCHMARKED_FAMILY_'+('DESKTOP' if width>600 else 'MOBILE')+'=PASS',flush=True)
                  page.close()
              # A deployed page against an older backend must stop BEFORE collecting
              # the guardian's private contact details, with a specific outage notice.
              blocked=browser.new_page(viewport={'width':390,'height':844})
              def old_api(route):
                  route.fulfill(status=404,content_type='application/json',
                      body='{"detail":"Not Found"}',
                      headers={'access-control-allow-origin':'*',
                               'access-control-allow-headers':'*',
                               'access-control-allow-methods':'GET, POST, OPTIONS'})
              blocked.route('**/api/pilot/family/onboarding',old_api)
              blocked.goto('http://127.0.0.1:18765/',wait_until='networkidle')
              blocked.locator('#family-start').click()
              expect(blocked.locator('#family-error')).to_contain_text('현재 어르신 등록 서비스를 이용할 수 없습니다.')
              assert blocked.locator('#family-name').count()==0
              print('RAJ_STALE_API_BLOCKS_BEFORE_CONTACT_COLLECTION=PASS',flush=True)
              blocked.close()
              browser.close()
          print('RAJ_NO_PRECONSENT_PAYMENT_NO_FAKE_CALL=PASS')
          PY
          python3 /tmp/family-qa.py
