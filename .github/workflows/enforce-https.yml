name: Enforce HTTPS for journal domain
on:
  push:
    branches: [main]
    paths: [.github/workflows/enforce-https.yml]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read certificate and request HTTPS enforcement
        env:
          TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const path='https://api.github.com/repos/suaveforge/reverse-age-journal-deploy/pages';
          const headers={
            Authorization:'Bearer '+process.env.TOKEN,
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'raj-https-enforce',
            'Content-Type':'application/json'
          };
          const check=await fetch(path,{headers});
          const current=await check.json();
          console.log('GITHUB_PAGES_HTTP='+check.status);
          console.log('PAGES_CNAME='+String(current.cname||''));
          console.log('PAGES_STATUS='+String(current.status||''));
          console.log('CERT_STATE='+String(current.https_certificate?.state||''));
          console.log('CERT_DESCRIPTION='+String(current.https_certificate?.description||''));
          console.log('ENFORCED_BEFORE='+String(current.https_enforced));
          if(check.status!==200 || current.cname!=='reverse-age-journal.suaveforge.com')process.exit(2);
          if(current.https_enforced===true){console.log('HTTPS_ENFORCE_ALREADY_DONE');process.exit(0);}
          const update=await fetch(path,{method:'PUT',headers,body:JSON.stringify({https_enforced:true})});
          const body=await update.text();
          console.log('HTTPS_ENFORCE_HTTP='+update.status);
          if(update.status!==204){
            let reason='';try{reason=JSON.parse(body).message||''}catch{}
            console.log('HTTPS_ENFORCE_REASON='+reason.slice(0,240));
            process.exit(3);
          }
          console.log('HTTPS_ENFORCED_PASS');
          NODE
