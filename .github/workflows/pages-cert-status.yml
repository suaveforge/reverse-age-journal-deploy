name: Inspect clean-domain Pages HTTPS certificate state
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages-cert-status.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages certificate issuance and DNS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          data=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/suaveforge/reverse-age-journal-deploy/pages')
          echo "$data" | jq '{url, status, cname, https_enforced, certificate: .https_certificate, build_type, source}'
          echo 'DNS_CNAME:'
          curl -fsS --max-time 15 -H 'accept: application/dns-json' \
            'https://cloudflare-dns.com/dns-query?name=reverse-age-journal.suaveforge.com&type=CNAME' | jq '{Status, Answer}'
          echo 'DNS_A:'
          curl -fsS --max-time 15 -H 'accept: application/dns-json' \
            'https://cloudflare-dns.com/dns-query?name=reverse-age-journal.suaveforge.com&type=A' | jq '{Status, Answer}'
