<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f1">
  <meta name="description" content="전화로 나눈 하루를 가족의 일기로 남깁니다.">
  <title>Reverse Age Journal | 기쁜사이</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="Reverse Age Journal 홈">
        <strong>기쁜사이</strong>
        <span>Reverse Age Journal</span>
      </a>
      <div class="header-actions">
        <nav class="view-nav" aria-label="사용자 화면">
          <button type="button" class="nav-item active" data-view="family" aria-current="page">가족</button>
          <button type="button" class="nav-item" data-view="operator">상담사</button>
        </nav>
        <button type="button" id="auth-button" class="login-button">로그인</button>
      </div>
    </header>

    <main class="main">
      <div id="readiness" class="readiness" role="status" hidden></div>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">전화로 나눈 하루,<br><span>일기로 남깁니다.</span></h1>
        <p class="hero-subtitle">어르신은 전화로 이야기하고, 가족은 일기로 읽습니다.</p>
        <div class="hero-actions">
          <button type="button" id="start-button" class="big-button primary">
            <span>가족 등록하기</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
          <button type="button" id="reserve-button" class="big-button outline">
            <span>통화 일정 잡기</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <section class="workspace" id="workspace" aria-labelledby="workspace-title">
        <div class="section-heading">
          <h2 id="workspace-title">우리 가족의 기록</h2>
          <div class="family-selector">
            <label id="recipient-label" for="recipient-select">가족 선택</label>
            <select id="recipient-select" aria-labelledby="recipient-label">
              <option value="">등록된 가족 없음</option>
            </select>
          </div>
        </div>

        <div id="family-view">
          <div class="summary" aria-label="이용 현황">
            <div class="stat">
              <span class="stat-name">남은 통화</span>
              <strong id="balance-value" class="stat-number">—</strong>
            </div>
            <div class="stat">
              <span class="stat-name">다음 통화</span>
              <strong id="next-call" class="stat-number stat-date">예약 없음</strong>
            </div>
            <div class="stat">
              <span class="stat-name">쌓인 일기</span>
              <strong id="diary-count" class="stat-number">—</strong>
            </div>
          </div>

          <div class="content-grid">
            <section class="content-card" aria-labelledby="schedule-title">
              <div class="card-top"><h3 id="schedule-title">통화 일정</h3><span class="top-rule" aria-hidden="true"></span></div>
              <div id="schedule-list" class="empty-state">예정된 통화가 없습니다.</div>
            </section>
            <section class="content-card" aria-labelledby="diary-title">
              <div class="card-top"><h3 id="diary-title">우리의 일기</h3><span class="top-rule" aria-hidden="true"></span></div>
              <div id="diary-list" class="empty-state">아직 남겨진 일기가 없습니다.</div>
            </section>
          </div>

          <section class="package-panel" aria-labelledby="package-title">
            <h3 id="package-title">이용권</h3>
            <div id="packages" class="package-actions"><span class="tag-not-ready">상품 준비 중</span></div>
          </section>
        </div>

        <div id="operator-view" hidden>
          <div class="operator-top">
            <div class="operator-summary">
              <div class="stat"><span class="stat-name">등록 이용자</span><strong id="operator-users" class="stat-number">—</strong></div>
              <div class="stat"><span class="stat-name">예정된 통화</span><strong id="operator-upcoming" class="stat-number">—</strong></div>
            </div>
            <button type="button" id="new-package-button" class="big-button primary operator-action">
              <span>이용권 등록</span><span class="button-arrow" aria-hidden="true">+</span>
            </button>
          </div>
          <section class="content-card operator-card" aria-labelledby="operator-title">
            <div class="card-top"><h3 id="operator-title">이용자</h3><span class="top-rule" aria-hidden="true"></span></div>
            <div id="operator-list" class="empty-state">상담사 로그인 후 확인할 수 있습니다.</div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <dialog id="modal" aria-labelledby="modal-title">
    <form id="modal-form" method="dialog" novalidate>
      <div class="dialog-head">
        <h2 id="modal-title">등록하기</h2>
        <button id="modal-close" class="close-button" type="button" aria-label="닫기">×</button>
      </div>
      <div id="modal-fields"></div>
      <p id="modal-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="modal-cancel" type="button" class="button-light">취소</button>
        <button id="modal-save" type="submit" class="button-save">저장하기</button>
      </div>
    </form>
  </dialog>
</body>
</html>
