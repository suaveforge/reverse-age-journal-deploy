<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <title>어르신 웹전화 | 기쁜사이</title>
  <link rel="stylesheet" href="./receive.css">
  <script defer src="./config.js"></script>
  <script defer src="./receive.js"></script>
</head>
<body>
  <main class="receiver">
    <header><strong>기쁜사이</strong><small>어르신 웹전화</small></header>
    <section class="center" aria-live="polite">
      <div class="signal" id="receiver-signal" aria-hidden="true">☎</div>
      <h1 id="receiver-title">연결 준비</h1>
      <p id="receiver-note">잠시만 기다려 주세요.</p>
      <div id="receiver-incoming" hidden>
        <button id="receiver-answer" class="action primary" type="button">전화 받기</button>
        <button id="receiver-decline" class="action secondary" type="button">거절</button>
      </div>
      <div id="receiver-connected" hidden>
        <button id="receiver-sound" class="action secondary" type="button">소리 켜기</button>
        <button id="receiver-hangup" class="action danger" type="button">통화 종료</button>
      </div>
      <button id="receiver-refresh" class="action secondary" type="button" hidden>다시 확인</button>
      <p id="receiver-error" class="error" role="alert" hidden></p>
    </section>
    <footer>통화를 받으면 AI 상담이 시작됩니다. 통화·녹음 동의 후 이용해 주세요.</footer>
  </main>
</body>
</html>
