name: Family and administrator real-click journey QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'family-demo.js'
      - 'styles.css'
      - '.github/workflows/family-journey-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Browser-test family flow without real calls or payments
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app.js
          node --check family-demo.js
          python3 -m pip -q install playwright pillow
          python3 -m http.server 18765 --bind 127.0.0.1 >/tmp/raj-family-server.log 2>&1 &
          cat >/tmp/family-journey-qa.py <<'PY'
          import base64,io
          from PIL import Image
          from playwright.sync_api import sync_playwright,expect
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
              for width,height in [(1365,900),(390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:18765/',wait_until='networkidle',timeout=40000)
                  expect(page.locator('#family-journey')).to_be_visible()
                  expect(page.locator('#counselor-pilot')).to_be_hidden()
                  expect(page.locator('#admin-entry')).to_have_text('관리자 접속')
                  expect(page.locator('.header-actions')).to_be_hidden()
                  expect(page.locator('#auth-button')).to_be_hidden()
                  assert page.evaluate('document.documentElement.scrollWidth')==width,'horizontal overflow landing'
                  assert page.evaluate('document.body.scrollHeight')<=height+110,'landing has unnecessary scroll'
                  page.locator('#family-start').click()
                  expect(page.locator('#family-name')).to_be_visible()
                  assert page.locator('#family-elder').count()==0
                  page.locator('#family-name').fill('김보호자')
                  page.locator('#family-next').click()
                  expect(page.locator('#family-elder')).to_be_visible()
                  page.locator('#family-elder').fill('김어르신')
                  page.locator('#family-phone').fill('01012345678')
                  page.locator('#family-register').click()
                  expect(page.locator('#family-error')).to_be_visible()
                  page.locator('#family-consent').check()
                  page.locator('#family-register').click()
                  expect(page.locator('#family-three')).to_be_visible()
                  page.locator('#family-five').click()
                  expect(page.locator('#family-pay')).to_be_visible()
                  expect(page.locator('.family-important')).to_contain_text('실제 금액은 청구되지 않습니다')
                  page.locator('#family-pay').click()
                  expect(page.locator('#family-when')).to_be_visible()
                  expect(page.locator('.family-important')).to_contain_text('실제로 발신되지 않습니다')
                  page.locator('#family-when').fill('2026-11-06T14:00')
                  page.locator('#family-reserve').click()
                  expect(page.locator('.family-confirm')).to_contain_text('김어르신')
                  expect(page.locator('.family-confirm')).to_contain_text('5회')
                  expect(page.locator('#family-record')).to_be_visible()
                  page.reload(wait_until='networkidle')
                  expect(page.locator('#family-record')).to_be_visible()
                  page.locator('#family-record').click()
                  expect(page.locator('.family-no-record')).to_have_text('아직 통화 기록이 없습니다.')
                  page.locator('#admin-entry').click()
                  expect(page.locator('#family-journey')).to_be_hidden()
                  expect(page.locator('#counselor-pilot')).to_be_visible()
                  expect(page.locator('#pilot-login')).to_be_visible()
                  expect(page.locator('#admin-entry')).to_have_text('가족 화면')
                  page.locator('#admin-entry').click()
                  expect(page.locator('#family-journey')).to_be_visible()
                  expect(page.locator('.family-no-record')).to_be_visible()
                  assert page.evaluate('document.documentElement.scrollWidth')==width,'horizontal overflow end'
                  assert not errors,errors
                  # Capture top of the public homepage, not only the confirmed state.
                  page.evaluate('sessionStorage.removeItem("raj.family.walkthrough.v1")')
                  page.reload(wait_until='networkidle')
                  shot=page.screenshot(full_page=True)
                  pic=Image.open(io.BytesIO(shot)).convert('RGB')
                  pic.thumbnail((800,950))
                  buf=io.BytesIO();pic.save(buf,format='JPEG',quality=65,optimize=True)
                  print('FAMILY_HOME_IMAGE_'+('DESKTOP' if width>600 else 'MOBILE')+'='+base64.b64encode(buf.getvalue()).decode(),flush=True)
                  print('RAJ_FAMILY_REAL_CLICK_'+('DESKTOP' if width>600 else 'MOBILE')+'=PASS',flush=True)
                  page.close()
              browser.close()
          print('RAJ_NO_REAL_PAYMENT_NO_AUTODIAL_NO_FAKE_CALL_RECORD=PASS')
          PY
          python3 /tmp/family-journey-qa.py
