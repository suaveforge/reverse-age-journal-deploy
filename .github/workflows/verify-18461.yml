name: Verify independent direct HTTPS 18461 from outside server123
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-18461.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: CA-verified public port connection
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN=reverse-age-journal.suaveforge.com
          URL="https://$DOMAIN:18461/"
          echo 'DIRECT_PORT_PUBLIC_CHECK_START'
          curl -fsSL --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --retry-all-errors \
            -o /tmp/raj.html \
            -w 'DIRECT_HTTPS_STATUS=%{http_code}\nDIRECT_SSL_VERIFY=%{ssl_verify_result}\nDIRECT_REMOTE_IP=%{remote_ip}\n' "$URL"
          grep -q 'Reverse Age Journal' /tmp/raj.html
          echo 'RAJ_DIRECT_PUBLIC_HTTPS_18461=PASS'
          echo 'RECHECK_AFTER_JOURNAL_CADDY_BLOCK_REMOVAL=PASS'
