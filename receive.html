<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fdfbf7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="기쁜사이">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>어르신 웹전화 | 기쁜사이</title>
  <link rel="stylesheet" href="./receive.css?v=20261101-unified05">
  <script defer src="./config.js"></script>
  <script defer src="https://jssip.net/download/releases/jssip-3.10.0.min.js"></script>
  <script defer src="./receive.js?v=25-sip-foreground"></script>
</head>
<body>
  <main class="receiver">
    <header><a class="brand-home" href="./" aria-label="기쁜사이 홈으로 이동"><strong>기쁜사이</strong></a><small>어르신 웹전화</small></header>
    <section class="center" aria-live="polite">
      <div class="signal" id="receiver-signal" aria-hidden="true">☎</div>
      <h1 id="receiver-title">연결 준비</h1>
      <p id="receiver-note">잠시만 기다려 주세요.</p>
      <p id="receiver-push-status" class="push-status" role="status" hidden></p>
      <button id="receiver-enable-notifications" class="action primary" type="button" hidden>잠금화면 전화 알림 켜기</button>
      <p id="receiver-sip-status" class="push-status" role="status" hidden></p>
      <button id="receiver-reconnect" class="action secondary" type="button" hidden>통화 연결 다시 하기</button>
      <div id="receiver-consent-panel" hidden>
        <p>가족이 안부 상담을 신청했습니다. AI가 예약 시간과 이후 3일마다 같은 시간에 이 화면으로 상담 전화를 걸며, 음성을 처리하고 녹음과 대화 기록을 만들 수 있습니다. 원치 않으면 동의하지 않아도 됩니다.</p>
        <label style="display:block;margin:20px 0;font-size:1rem"><input id="receiver-consent-check" type="checkbox" style="width:24px;height:24px;vertical-align:middle"> 3일 간격 웹전화 상담·음성 처리·녹음에 동의합니다</label>
        <button id="receiver-consent-confirm" class="action primary" type="button">동의하고 시작 준비</button>
      </div>
      <button id="receiver-alert" class="action secondary" type="button">벨소리 켜기</button>
      <div id="receiver-incoming" hidden>
        <button id="receiver-answer" class="action primary" type="button">전화 받기</button>
        <button id="receiver-decline" class="action secondary" type="button">거절</button>
      </div>
      <div id="receiver-voice" class="voice-panel" hidden>
        <p id="receiver-duration" class="call-duration" aria-label="통화 시간">00:00</p>
        <div class="voice-participants" aria-label="실시간 통화 상태">
          <div id="voice-ai" class="voice-party">
            <strong>AI</strong>
            <span id="voice-ai-status" class="voice-status">듣는 중</span>
            <div id="voice-ai-bars" class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div id="voice-self" class="voice-party">
            <strong>나</strong>
            <span id="voice-self-status" class="voice-status">마이크 연결 중</span>
            <div id="voice-self-bars" class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
      </div>
      <div id="receiver-connected" hidden>
        <button id="receiver-sound" class="action secondary" type="button" hidden>소리 켜기</button>
        <button id="receiver-mute" class="action secondary" type="button" aria-pressed="false">마이크 끄기</button>
        <button id="receiver-hangup" class="action danger" type="button">통화 종료</button>
      </div>
      <p id="receiver-error" class="error" role="alert" hidden></p>
    </section>
    <footer id="receiver-footer">통화를 받으면 AI 상담이 시작됩니다. 통화·녹음 동의 후 이용해 주세요.</footer>
  </main>
</body>
</html>
