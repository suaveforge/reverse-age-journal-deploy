name: Development board and chat mobile browser QA
on:
  push:
    branches: [main]
    paths:
      - 'dev-community.js'
      - 'dev-community.css'
      - 'raj-app-setup.js'
      - 'index.html'
      - 'qa/dev-community-mobile-qa.cjs'
      - '.github/workflows/dev-community-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify live frontend with mocked community writes
        run: node qa/dev-community-mobile-qa.cjs
